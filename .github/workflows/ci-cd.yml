name: CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: survey
          POSTGRES_PASSWORD: survey
          POSTGRES_DB: survey_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U survey -d survey_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://survey:survey@localhost:5432/survey_db
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-key
      CORS_ORIGINS: http://localhost,http://localhost:5173,http://127.0.0.1:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall app alembic

      - name: Apply database migrations
        run: |
          alembic upgrade head

      - name: Start backend and check health
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 5
          curl -f http://127.0.0.1:8000/api/v1/health

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show Node and npm versions
        run: |
          node -v
          npm -v

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

  docker-smoke-test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for frontend dist
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend dist
        working-directory: frontend
        run: |
          npm cache clean --force
          npm install --no-audit --no-fund
          npm run build

      - name: Create .env file
        run: |
          cat > .env <<EOF
          POSTGRES_USER=survey
          POSTGRES_PASSWORD=survey
          POSTGRES_DB=survey_db
          DATABASE_URL=postgresql+asyncpg://survey:survey@postgres:5432/survey_db
          REDIS_URL=redis://redis:6379/0
          JWT_SECRET=ci-secret-key
          CORS_ORIGINS=http://localhost,http://localhost:5173,http://127.0.0.1:5173
          EOF

      - name: Build Docker images
        run: docker compose build

      - name: Start Docker Compose
        run: docker compose up -d

      - name: Check containers status
        run: docker compose ps

      - name: Check application health through Nginx
        run: |
          curl --retry 20 --retry-delay 3 --retry-connrefused -f http://localhost/api/v1/health

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v